<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Agendamento — Rafael Linhares</title>

<style>
  :root {
    --navy-1: #091B2B;
    --gutter: 64px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: #FFFFFF; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  body {
    background: #FFFFFF;
    color: var(--navy-1);
    font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }

  .page {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding: 56px var(--gutter) 0;
  }

  .page h1 {
    margin-bottom: 24px;
    font-size: 40px;
    line-height: 1.15;
    font-weight: 800;
    color: var(--navy-1);
  }

  @media (max-width: 640px) {
    :root { --gutter: 16px; }
    .page { padding-top: 40px; }
    .page h1 { font-size: 28px; padding: 0 16px; }
  }

    /* =====================================================
        CABEÇALHO E RODAPÉ (MINIMALISTAS)
    ===================================================== */

    .rl-header,
    .rl-footer {
      background: #000000;
      color: #ffffff;
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    }

    .rl-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding-top: env(safe-area-inset-top);
    }

    .rl-header-inner {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      max-width: 1280px;
      height: 64px;
      margin: 0 auto;
      padding: 0 32px;
    }

    .rl-logo {
      justify-self: start;
      display: flex;
      width: 36px;
      height: 36px;
    }

    .rl-logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .rl-social svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .rl-nav {
      display: flex;
      gap: 32px;
    }

    .rl-nav a,
    .rl-footer-nav a {
      padding: 4px 0;
      font-size: 15px;
      line-height: 1.4;
      color: #ffffff;
      border-bottom: 1px solid transparent;
      transition: border-color .2s ease, opacity .2s ease;
    }

    .rl-nav a[aria-current="page"],
    .rl-footer-nav a[aria-current="page"] {
      border-bottom-color: #ffffff;
    }

    @media (hover: hover) and (pointer: fine) {
      .rl-nav a:hover,
      .rl-footer-nav a:hover {
        border-bottom-color: #ffffff;
      }
    }

    .rl-social {
      display: flex;
      width: 28px;
      height: 28px;
      color: #ffffff;
    }

    .rl-header .rl-social {
      justify-self: end;
    }

    .rl-footer {
      margin-top: 96px;
      padding: 48px 32px calc(28px + env(safe-area-inset-bottom));
    }

    .rl-footer-inner {
      max-width: 1280px;
      margin: 0 auto;
    }

    .rl-footer-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 32px;
    }

    .rl-footer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, .16);
      font-size: 13px;
      color: rgba(255, 255, 255, .6);
    }

    .rl-footer .rl-social {
      width: 22px;
      height: 22px;
    }

    @media (max-width: 640px) {

      .rl-header-inner {
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "logo social"
          "nav  nav";
        height: auto;
        padding: 12px 20px 0;
        row-gap: 4px;
      }

      .rl-logo { grid-area: logo; width: 30px; height: 30px; }
      .rl-header .rl-social { grid-area: social; width: 24px; height: 24px; }

      .rl-nav {
        grid-area: nav;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 10px;
      }

      .rl-nav a { font-size: 13px; }

      .rl-footer { margin-top: 64px; padding: 40px 20px calc(24px + env(safe-area-inset-bottom)); }
      .rl-footer-nav { gap: 10px 24px; }
      .rl-footer-bottom { flex-direction: column-reverse; gap: 16px; }
    }

</style>
</head>

<body>

      <a href="https://linkedin.com/in/rafael-souza-econ" class="rl-social" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn de Rafael Linhares">

        <a href="para-voce.html">Para Você</a>

      <div class="rl-footer-bottom">
        <span>© 2026 Rafael Linhares · CORECON/SP 38615</span>
