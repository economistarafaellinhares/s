<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Agendamento — Rafael Linhares</title>

<style>
  :root {
    --navy-1: #091B2B;
    --green: #19C995;
    --gutter: 64px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: #FFFFFF; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  body {
    background: #FFFFFF;
    color: var(--navy-1);
    font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }

  .page {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding: 56px var(--gutter) 0;
  }

  .page h1 {
    margin-bottom: 24px;
    font-size: 40px;
    line-height: 1.15;
    font-weight: 800;
    color: var(--navy-1);
  }

  @media (max-width: 640px) {
    :root { --gutter: 16px; }
    .page { padding-top: 40px; }
    .page h1 { font-size: 28px; padding: 0 16px; }
  }

    /* =====================================================
        CABEÇALHO E RODAPÉ (MINIMALISTAS)
    ===================================================== */

    .rl-header,
    .rl-footer {
      background: #000000;
      color: #ffffff;
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    }

    .rl-header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding-top: env(safe-area-inset-top);
    }

    .rl-header-inner {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      max-width: 1280px;
      height: 64px;
      margin: 0 auto;
      padding: 0 32px;
    }

    .rl-logo {
      justify-self: start;
      display: flex;
      width: 36px;
      height: 36px;
    }

    .rl-logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .rl-social svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .rl-nav {
      display: flex;
      gap: 32px;
    }

    .rl-nav a,
    .rl-footer-nav a {
      padding: 4px 0;
      font-size: 15px;
      line-height: 1.4;
      color: #ffffff;
      border-bottom: 1px solid transparent;
      transition: border-color .2s ease, opacity .2s ease;
    }

    .rl-nav a[aria-current="page"],
    .rl-footer-nav a[aria-current="page"] {
      border-bottom-color: #ffffff;
    }

    @media (hover: hover) and (pointer: fine) {
      .rl-nav a:hover,
      .rl-footer-nav a:hover {
        border-bottom-color: #ffffff;
      }
    }

    .rl-social {
      display: flex;
      width: 28px;
      height: 28px;
      color: #ffffff;
    }

    .rl-header .rl-social {
      justify-self: end;
    }

    /* MENU MOBILE (3 RISCOS) */

    .rl-menu-toggle {
      display: none;
      position: relative;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      background: none;
      color: #ffffff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .rl-menu-toggle:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 3px;
    }

    .rl-menu-toggle span {
      position: absolute;
      left: 4px;
      right: 4px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
      transition: transform .2s ease, opacity .2s ease, top .2s ease;
    }

    .rl-menu-toggle span:nth-child(1) { top: 8px; }
    .rl-menu-toggle span:nth-child(2) { top: 13px; }
    .rl-menu-toggle span:nth-child(3) { top: 18px; }

    .rl-menu-toggle[aria-expanded="true"] span:nth-child(1) { top: 13px; transform: rotate(45deg); }
    .rl-menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    .rl-menu-toggle[aria-expanded="true"] span:nth-child(3) { top: 13px; transform: rotate(-45deg); }

    .rl-footer {
      margin-top: 96px;
      padding: 48px 32px calc(28px + env(safe-area-inset-bottom));
    }

    .rl-footer-inner {
      max-width: 1280px;
      margin: 0 auto;
    }

    .rl-footer-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 32px;
    }

    .rl-footer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, .16);
      font-size: 13px;
      color: rgba(255, 255, 255, .6);
    }

    .rl-footer .rl-social {
      width: 22px;
      height: 22px;
    }

    @media (max-width: 640px) {

      .rl-header-inner {
        grid-template-columns: 1fr auto auto;
        grid-template-areas:
          "logo social toggle"
          "nav  nav    nav";
        align-items: center;
        height: auto;
        padding: 12px 20px;
        column-gap: 18px;
        row-gap: 0;
      }

      .rl-logo { grid-area: logo; width: 30px; height: 30px; }
      .rl-header .rl-social { grid-area: social; width: 24px; height: 24px; }

      .rl-menu-toggle { display: block; grid-area: toggle; }

      .rl-nav {
        grid-area: nav;
        display: none;
        flex-direction: column;
        gap: 0;
        padding-top: 8px;
      }

      .rl-header.is-open .rl-nav { display: flex; }

      .rl-nav a,
      .rl-nav a[aria-current="page"] {
        padding: 14px 0;
        font-size: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, .12);
      }

      .rl-nav a:last-child { border-bottom: 0; }

      .rl-nav a[aria-current="page"] { font-weight: 700; }

      .rl-footer { margin-top: 64px; padding: 40px 20px calc(24px + env(safe-area-inset-bottom)); }
      .rl-footer-nav { gap: 10px 24px; }
      .rl-footer-bottom { flex-direction: column-reverse; gap: 16px; }
    }

</style>
</head>

<body>

  <header class="rl-header">
    <div class="rl-header-inner">

      <a href="index.html" class="rl-logo" aria-label="Rafael Linhares — Início">
        <img src="00136c20-a269-4d25-839d-06056173b7cd.jpeg" alt="Logo Rafael Linhares">
      </a>

      <nav class="rl-nav" id="rl-nav-principal" aria-label="Principal">
        <a href="index.html">Início</a>
        <a href="para-empresas.html">Para Empresas</a>
        <a href="para-voce.html">Para Você</a>
        <a href="agendamento.html" aria-current="page">Agendamento</a>
      </nav>

      <a href="https://www.linkedin.com/in/rafael-linhares-s" class="rl-social" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn de Rafael Linhares">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="4.5" cy="4.5" r="2.5"/><rect x="2" y="9" width="5" height="13"/><path d="M9 9h4.5v1.800c.7-1.200 2.100-2.100 4-2.100 3.5 0 4.5 2.300 4.5 5.5V22h-5v-6.5c0-1.5-.3-2.5-1.700-2.5-1.5 0-2.300 1-2.300 2.700V22H9z"/></svg>
      </a>

      <button type="button" class="rl-menu-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="rl-nav-principal">
        <span></span><span></span><span></span>
      </button>

    </div>
  </header>

<main class="page">

  <h1></h1>

  <!-- Widget em linha do Calendly - início -->
  <div class="calendly-inline-widget" data-url="https://calendly.com/rafael-linhares-t9cu/sessao" style="min-width:320px;height:700px;"></div>
  <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
  <!-- Widget em linha do Calendly - fim -->

</main>

  <footer class="rl-footer">
    <div class="rl-footer-inner">

      <nav class="rl-footer-nav" aria-label="Rodapé">
        <a href="index.html">Início</a>
        <a href="para-voce.html">Para Você</a>
        <a href="para-empresas.html">Para Empresas</a>
        <a href="agendamento.html" aria-current="page">Agendamento</a>
      </nav>

      <div class="rl-footer-bottom">
        <span>© 2026 Rafael Linhares</span>
        <a href="https://www.linkedin.com/in/rafael-linhares-s" class="rl-social" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn de Rafael Linhares">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="4.5" cy="4.5" r="2.5"/><rect x="2" y="9" width="5" height="13"/><path d="M9 9h4.5v1.800c.7-1.200 2.100-2.100 4-2.100 3.5 0 4.5 2.300 4.5 5.5V22h-5v-6.5c0-1.5-.3-2.5-1.700-2.5-1.5 0-2.300 1-2.300 2.700V22H9z"/></svg>
        </a>
      </div>

    </div>
  </footer>

  <script>
    (function () {
      var header = document.querySelector('.rl-header');
      var toggle = document.querySelector('.rl-menu-toggle');
      if (!header || !toggle) return;

      function setMenu(open) {
        header.classList.toggle('is-open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        toggle.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
      }

      toggle.addEventListener('click', function () {
        setMenu(!header.classList.contains('is-open'));
      });

      header.querySelectorAll('.rl-nav a').forEach(function (link) {
        link.addEventListener('click', function () { setMenu(false); });
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') setMenu(false);
      });

      window.addEventListener('resize', function () {
        if (window.innerWidth > 640) setMenu(false);
      });
    })();
  </script>

</body>
</html>
