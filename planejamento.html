<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Título da página — Rafael Linhares</title>

<style>
  /* ===== BASE ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: #ffffff; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: #ffffff;
    color: #091B2B;
    font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }

  main { flex: 1; }

  .rl-footer { margin-top: 48px; }

  /* ===== ÁREA DO CONTEÚDO (apague este bloco quando colar o seu código) ===== */
  .rl-colar {
    max-width: 888px;
    margin: 72px auto 0;
    padding: 72px 32px;
    border: 2px dashed rgba(23, 52, 77, .3);
    border-radius: 16px;
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .04em;
    color: #526779;
  }

  /* ===== COLE AQUI O CSS DA SUA PÁGINA (se tiver) ===== */


  /* ===== CABEÇALHO E RODAPÉ ===== */
  /* =====================================================
      CABEÇALHO E RODAPÉ (MINIMALISTAS)
  ===================================================== */

  .rl-header,
  .rl-footer {
    background: #000000;
    color: #ffffff;
    font-family: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
  }

  .rl-header {
    position: sticky;
    top: 0;
    z-index: 50;
    padding-top: env(safe-area-inset-top);
  }

  .rl-header-inner {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    max-width: 1280px;
    height: 64px;
    margin: 0 auto;
    padding: 0 32px;
  }

  .rl-logo {
    justify-self: start;
    display: flex;
    width: 36px;
    height: 36px;
  }

  .rl-logo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .rl-social svg {
    width: 100%;
    height: 100%;
    fill: currentColor;
  }

  .rl-nav {
    display: flex;
    gap: 32px;
  }

  .rl-nav a,
  .rl-footer-nav a {
    padding: 4px 0;
    font-size: 15px;
    line-height: 1.4;
    color: #ffffff;
    border-bottom: 1px solid transparent;
    transition: border-color .2s ease, opacity .2s ease;
  }

  .rl-nav a[aria-current="page"],
  .rl-footer-nav a[aria-current="page"] {
    border-bottom-color: #ffffff;
  }

  @media (hover: hover) and (pointer: fine) {
    .rl-nav a:hover,
    .rl-footer-nav a:hover {
      border-bottom-color: #ffffff;
    }
  }

  .rl-social {
    display: flex;
    width: 28px;
    height: 28px;
    color: #ffffff;
  }

  .rl-header .rl-social {
    justify-self: end;
  }

  .rl-footer {
    margin-top: 96px;
    padding: 48px 32px calc(28px + env(safe-area-inset-bottom));
  }

  .rl-footer-inner {
    max-width: 1280px;
    margin: 0 auto;
  }

  .rl-footer-nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px 32px;
  }

  .rl-footer-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid rgba(255, 255, 255, .16);
    font-size: 13px;
    color: rgba(255, 255, 255, .6);
  }

  .rl-footer .rl-social {
    width: 22px;
    height: 22px;
  }

  @media (max-width: 640px) {

    .rl-header-inner {
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "logo social"
        "nav  nav";
      height: auto;
      padding: 12px 20px 0;
      row-gap: 4px;
    }

    .rl-logo { grid-area: logo; width: 30px; height: 30px; }
    .rl-header .rl-social { grid-area: social; width: 24px; height: 24px; }

    .rl-nav {
      grid-area: nav;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
    }

    .rl-nav a { font-size: 13px; }

    .rl-footer { margin-top: 64px; padding: 40px 20px calc(24px + env(safe-area-inset-bottom)); }
    .rl-footer-nav { gap: 10px 24px; }
    .rl-footer-bottom { flex-direction: column-reverse; gap: 16px; }
  }

  @media print { .rl-header, .rl-footer { display: none; } }
</style>
</head>

<body>

      <a href="https://linkedin.com/in/rafael-souza-econ" class="rl-social" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn de Rafael Linhares">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="4.5" cy="4.5" r="2.5"/><rect x="2" y="9" width="5" height="13"/><path d="M9 9h4.5v1.8c.7-1.2 2.1-2.1 4-2.1 3.5 0 4.5 2.3 4.5 5.5V22h-5v-6.5c0-1.5-.3-2.5-1.7-2.5-1.5 0-2.3 1-2.3 2.7V22H9z"/></svg>

  <!-- ===================== RODAPÉ ===================== -->

    <div class="rl-footer-inner">

      <nav class="rl-footer-nav" aria-label="Rodapé">
        <a href="index.html">Início</a>
        <a href="para-voce.html">Para Você</a>
        <a href="para-empresas.html">Para Empresas</a>

        <span>© 2026 Rafael Linhares · CORECON/SP 38615</span>

          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="4.5" cy="4.5" r="2.5"/><rect x="2" y="9" width="5" height="13"/><path d="M9 9h4.5v1.8c.7-1.2 2.1-2.1 4-2.1 3.5 0 4.5 2.3 4.5 5.5V22h-5v-6.5c0-1.5-.3-2.5-1.7-2.5-1.5 0-2.3 1-2.3 2.7V22H9z"/></svg>
